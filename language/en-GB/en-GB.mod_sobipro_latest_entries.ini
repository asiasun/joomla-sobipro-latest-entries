MOD_SOBIPRO_LATEST_ENTRIES="SobiPro Latest Entries"
MOD_SOBIPRO_LATEST_ENTRIES_XML_DESCRIPTION="Shows the latest SobiPro entries ordered by a configurable field. Requires SobiPro. Compatible with Joomla 3 and Joomla 4. Developed by AsiaSun.ir"

MOD_SOBIPRO_LATEST_ENTRIES_FIELD_ITEMS_COUNT="Number of entries"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_ITEMS_COUNT_DESC="How many entries to display."
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_SECTION="SobiPro section ID"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_SECTION_DESC="The SobiPro section that holds the entries."
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_SORT_FID="Sort field ID"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_SORT_FID_DESC="Field ID used for ordering (usually a date or release field). Entries are sorted descending by this field value."
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_TITLE_FID="Title field ID"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_TITLE_FID_DESC="Field ID that stores the entry title. Default is 1 on many SobiPro sites."
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_COVER_FID="Cover / image field ID"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_COVER_FID_DESC="Field ID of the image or cover field. The module uses the thumb or original path from the serialized field data."
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_CATEGORY_FID="Category field ID"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_CATEGORY_FID_DESC="Field ID that stores the primary category of the entry. Used to build the entry URL path."
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_BASE_PATH="Entry base path"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_BASE_PATH_DESC="Optional URL prefix before the category and entry alias (for example game-profile). Leave empty if entries are served from the site root."
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_ALLOWED_CATS="Allowed category IDs"
MOD_SOBIPRO_LATEST_ENTRIES_FIELD_ALLOWED_CATS_DESC="Optional comma-separated list of category IDs. Leave empty to show entries from all categories."
